# ==========================================================
#  Echo 主题配置
# ==========================================================

# --- 外观 ---
# 默认配色：auto 跟随系统 / dark 深色 / light 浅色
color_scheme: auto
# 主题主色（快捷写法，等价于 colors.accent）。改这一个值，
# 按钮、角标、链接高亮、发光阴影、品牌渐变会一起变。
accent: '#5b8cff'

# --- 配色 ---
# 只填你真正想改的项，其余全部由 accent 自动派生。
# accent      主色：按钮、选中态、链接、角标、进度条
# secondary   渐变辅色：留空则由 accent 自动提亮生成
# 下面这些一般不用填，需要精确覆盖时才写（写成 CSS 合法值即可）：
#   accent-soft        主色浅底（如选中项背景）
#   accent-soft-strong 暗色模式下的浅底
#   accent-strong      深色模式正文里用的主色（保证对比度）
#   accent-text        主色文字/行内代码色
#   accent-glow        主色发光阴影
#   warn               警告色（默认橙）
colors:
  accent: '#5b8cff'
  # 浅色主题下顶部横幅的浅蓝（不随 accent 变化，保证「浅蓝」观感稳定）
  banner_light: '#dbeafe'
  # secondary: '#8f6bff'
  # accent-glow: 'rgba(91, 140, 255, .3)'

# 卡片圆角
radius: 14px
# 三栏总宽度
layout_width: 1440px
# 三栏之间的间距（拉大后中栏更宽）
layout_gap: 36px
# 中栏最大宽度
main_width: 820px
# 宽屏（≥1680px）下中栏的封顶宽度；实际宽度会随视口在 820px ~ 该值之间伸缩
main_width_wide: 1240px
# 左右侧栏宽度
rail_width: 240px

# --- 站点图标 ---
# 浏览器标签栏 / 收藏夹 / 桌面快捷方式图标（建议 180×180 以上的 png）
# 留空则使用主题内置的 /images/favicon.svg
# 站点自己的 _config.yml 里写 favicon: /xxx.png 可覆盖本项
favicon: /images/favicon.svg

# --- 顶部导航 ---
header:
  # 导航栏品牌图标（网站名左侧）；留空则依次回退到 favicon、主题内置线条标识
  logo: ''
  # 顶部横幅背景图，留空则不显示
  banner: /images/covers/hexo-theme.svg
  # 背景图遮罩透明度 0~1
  overlay: 0.72

# --- 首页顶部大图（Hero）---
hero:
  # 总开关：false 则首页不显示顶部大图
  enable: true
  # 背景图：相对 source 的路径或绝对 URL；留空则回退到 header.banner
  image: /images/hero.svg
  # 高度（可写 520px / 60vh 等）
  height: 520px
  # 暗色遮罩 0~1，越大越暗、文字越清晰
  overlay: 0.42
  # 标题 / 副标题，留空则用 index.banner_title / banner_subtitle，再回退站点标题、描述
  title: ''
  subtitle: ''
  # 大图上的按钮，可增删；primary: true 为实心主按钮
  buttons:
    - text: 进入资源库
      url: /resources/
      icon: layers
      primary: true
    - text: 浏览归档
      url: /archives/
      icon: archive
      primary: false

# --- 菜单 ---
menu:
  首页: /
  文章: /articles/
  资源库: /resources/
  归档: /archives/
  关于: /about/

# --- 首页 ---
index:
  banner: true
  banner_title: Echo
  banner_subtitle: 影视 · 游戏 · MOD · 汉化 · 网络编程
  show_resource_entries: true
  post_per_page: 12

# ==========================================================
#  三栏布局
# ==========================================================
# 左栏：个人名片 / 音乐 / 分类 / 标签
# 右栏：统计 / 目录
rail:
  # 全局总开关
  enable: true
  left:
    enable: true
    width: 260px
  right:
    enable: true
    width: 260px

# --- 左栏组件 ---
# 个人名片
profile:
  enable: true
  avatar: /images/avatar.jpg
  name: Echo
  bio: 分享影视、游戏与各类资源，也折腾博客和 Mod 汉化。
  # 社交图标，name 用于匹配内置图标：github / bilibili / telegram / mail / rss / link
  social:
    - name: github
      url: https://github.com/
      title: GitHub
    - name: bilibili
      url: https://space.bilibili.com/
      title: 哔哩哔哩
    - name: telegram
      url: https://t.me/
      title: Telegram
    - name: mail
      url: mailto:you@example.com
      title: 邮箱
    - name: rss
      url: /atom.xml
      title: RSS

# 音乐播放器
music:
  enable: true
  title: 音乐
  # 单曲：填写音频直链（mp3 / m4a）；留空则播放器按钮不可用
  src: ''
  # 多曲播放列表（可选，填了就优先用它）
  #playlist:
  #  - name: 曲目一
  #    artist: 歌手
  #    src: https://example.com/a.mp3
  #    cover: /images/covers/hexo-theme.svg
  name: 示例曲目
  artist: 未知艺术家
  cover: /images/covers/hexo-theme.svg

# 分类（左栏）
category:
  enable: true
  title: 分类
  limit: 8

# 标签（左栏）
tags:
  enable: true
  title: 标签
  limit: 16

# --- 右栏组件 ---
# 站点统计
stats:
  enable: true
  title: 统计
  show:
    - posts      # 文章
    - categories # 分类
    - tags       # 标签
    - words      # 总字数
    - runtime    # 运行时长
    - updated    # 最后活动
  # 建站日期，用于计算运行时长
  since: 2024-01-01

# 文章目录
toc:
  enable: true
  title: 目录
  depth: 3

# --- 资源板块 ---
resource:
  show_fields:
    - version
    - platform
    - size
    - language
  show_password: true
  notice: '资源仅供学习交流，请在下载后 24 小时内删除。'
  pan_colors:
    百度网盘: '#2932e1'
    阿里云盘: '#ff6a00'
    夸克网盘: '#2f7dff'
    天翼云盘: '#0090ff'
    123云盘: '#1677ff'
    迅雷云盘: '#2f6bff'
    蓝奏云: '#3ba0ff'
    微云: '#12b7f5'
    奶牛快传: '#ffb02e'
    Google Drive: '#34a853'
    OneDrive: '#0f6cbd'
    Mega: '#d9272e'
    磁力链接: '#7a5cff'
    BT 种子: '#f59e0b'

# --- 文章页 ---
post:
  toc: true
  toc_depth: 3
  copyright: true
  updated: true
  words_per_minute: 300
  prev_next: true
  # 正文前的简介（取自 description 或摘要）
  intro: true

# --- 评论系统 ---
# 内置 giscus（基于 GitHub Discussions），数据存于你指定的公开仓库。
# 前置条件：该仓库需为 public、已安装 giscus app、且开启 Discussions。
comments:
  enable: true
  provider: giscus
  giscus:
    repo: wanwuzhishi/wanwuzhishi.github.io
    repo_id: R_kgDOU7KTsQ
    category: Announcements
    category_id: DIC_kwDOU7KTsc4DHQT_
    mapping: url          # 用页面 URL 关联 discussion
    strict: 0
    reactions_enabled: 1  # 主帖反应（👍🎉…）
    emit_metadata: 0
    input_position: top   # 评论框在评论上方
    theme: preferred_color_scheme  # 跟随系统；手动切主题时自动同步
    lang: zh-CN

# --- 页脚 ---
footer:
  since: 2024
  powered: true
  beian:
    enable: false
    text:
    link: https://beian.miit.gov.cn/

# --- 右栏：日历 ---
# 注意：文章页（含资源详情页）会自动隐藏日历与站点信息，只保留统计 + 目录
calendar:
  enable: true
  title: 日历

# --- 右栏：站点信息 ---
siteinfo:
  enable: true
  title: 站点信息
  build: Hexo
  version: Echo 1.0
  license: CC BY-NC-SA 4.0
  # 留空则使用站点 url
  domain: ''
