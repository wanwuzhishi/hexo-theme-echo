# ============================================================================
#  Echo 主题配置
# ----------------------------------------------------------------------------
#  覆盖优先级：站点 _config.yml > 主题本文件 > 代码内置默认值
#  也就是说，凡是下面标了「站点配置可覆盖」的项，都可以直接写进站点
#  的 _config.yml 里（同名同层级）来改，不用动主题文件。
#
#  改完记得重启 hexo server；只改 CSS/模板时一般热更新即可。
# ============================================================================


# ============================================================================
#  一、外观与配色
# ============================================================================

# 默认配色方案，可选值：
#   auto  —— 跟随访客系统设置（推荐）
#   dark  —— 强制深色
#   light —— 强制浅色
color_scheme: auto

# 主题主色（快捷写法，等价于下方 colors.accent）。
# 改这一个值，按钮、选中态、链接高亮、发光阴影、品牌渐变会一起联动。
# 想精细控制派生出来的各项，请改下面的 colors 段。
accent: '#5b8cff'

# 配色。只填你真正想改的项，其余全部由 accent 自动派生。
# 任何一项都会输出成同名 CSS 变量（kebab-case），写 CSS 合法值即可，
# 例如 accent_glow: 'rgba(91, 140, 255, .3)' → --accent-glow。
#
# 可直接覆盖的派生项（一般不用填，accent 变了会自动跟着变）：
#   accent            主色：按钮、选中态、链接、角标、进度条
#   secondary         渐变辅色：留空则由 accent 自动提亮生成
#   accent_soft       主色浅底（如选中项背景）
#   accent_soft_strong 暗色模式下的浅底
#   accent_strong     深色模式正文里用的主色（保证对比度）
#   accent_text       主色文字 / 行内代码色
#   accent_glow       主色发光阴影
#   warn              警告色（默认橙）
colors:
  accent: '#5b8cff'

  # 浅色主题下顶部横幅的底色。
  # 刻意不跟随 accent 变化，保证「浅蓝」这个观感稳定。
  # 想换成薄荷绿、浅粉等浅色，改这一行即可（保持明亮低饱和）。
  banner_light: '#dbeafe'

  # 下面几项按需取消注释来精确覆盖派生值
  # secondary: '#8f6bff'
  # accent_glow: 'rgba(91, 140, 255, .3)'

# 卡片 / 面板圆角
radius: 14px


# ============================================================================
#  二、三栏布局尺寸
# ----------------------------------------------------------------------------
#  全部由 layout/_partial/head.ejs 注入成 CSS 变量。
#  站点配置可覆盖：把这几项原样写进站点 _config.yml 即可。
# ============================================================================

# 三栏容器的总宽度（不含左右内边距）
layout_width: 1440px
# 左栏 / 正文 / 右栏之间各留多少间距，拉大后中栏会跟着变宽
layout_gap: 36px
# 正文中栏的常规最大宽度
main_width: 820px
# 视口 ≥1680px 时正文中栏的封顶宽度。
# 实际宽度在 main_width ~ 此值之间随视口伸缩，窄屏不受影响。
main_width_wide: 1240px
# 左栏 / 右栏的默认宽度。
# 优先级：下面 rail.left.width / rail.right.width > 本项 > 内置 240px
rail_width: 240px


# ============================================================================
#  三、站点图标
# ============================================================================

# 浏览器标签栏 / 收藏夹 / 桌面快捷方式图标。
# 建议用 180×180 以上的 png。留空则用主题内置的 /images/favicon.svg。
# 站点配置可覆盖：站点 _config.yml 里的 favicon 优先级更高，
# 且这个值同时会用作导航栏网站名左侧的品牌图标。
favicon: /images/favicon.svg


# ============================================================================
#  四、顶部导航栏
# ============================================================================

header:
  # 导航栏品牌图标（网站名左侧那个）。
  # 留空则依次回退：站点 favicon → 主题 favicon → 内置线条标识。
  logo: ''

  # 顶部横幅背景图（会同时被内页横幅复用），留空则不显示。
  # 浅色主题下会自动换用 colors.banner_light 浅蓝底、不显示大图。
  banner: /images/covers/hexo-theme.svg

  # 背景图上方的暗色遮罩透明度 0~1。
  # 越大越暗、白色文字越清晰；0.6~0.8 之间比较平衡。
  overlay: 0.72


# ============================================================================
#  五、首页顶部大图（Hero）
# ----------------------------------------------------------------------------
#  enable: false 时首页退回「简介卡片 + 按钮」布局。
#  大图启用时导航是透明悬浮在图上的，所以文字始终是白色（任何主题都如此）。
# ============================================================================

hero:
  # 总开关
  enable: true

  # 背景图：相对 source 的路径或完整 URL。
  # 建议 1920×1080 以上横向图，主体偏中间，避免窄屏裁切时切掉重点。
  # 留空则回退到 header.banner。
  image: /images/hero.svg

  # 大图区高度，可写 520px / 60vh 等任意 CSS 长度
  height: 520px

  # 图上暗色遮罩 0~1，越大越暗、文字越清晰
  overlay: 0.42

  # 大标题 / 副标题。
  # 留空依次回退：index.banner_title / index.banner_subtitle → 站点 title / description
  title: ''
  subtitle: ''

  # 图上的按钮，可增删任意项。
  #   text    按钮文字
  #   url     跳转地址
  #   icon    内置图标名（见指南第四篇的图标清单），可省略
  #   primary true 为实心主按钮，false / 不填为描边按钮
  buttons:
    - text: 进入资源库
      url: /resources/
      icon: layers
      primary: true
    - text: 浏览归档
      url: /archives/
      icon: archive
      primary: false


# ============================================================================
#  六、导航菜单
# ----------------------------------------------------------------------------
#  格式为「菜单名: 路径」，菜单会自动按这里的顺序排列。
#  菜单名决定内置图标（首页/文章/资源库/影视/游戏/MOD/汉化/归档/关于/
#  分类/标签/友链 有对应图标），用别的名字则不显示图标，也正常可用。
#  单行语法，所以键名不建议带冒号和空格。
# ============================================================================

menu:
  首页: /
  文章: /articles/
  资源库: /resources/
  归档: /archives/
  关于: /about/


# ============================================================================
#  七、首页内容区
# ----------------------------------------------------------------------------
#  这里的标题在 Hero 关闭（hero.enable: false）时才会显示。
# ============================================================================

index:
  # 首页大标题（Hero 关闭时才用）
  banner_title: Echo
  # 首页副标题（Hero 关闭时才用）
  banner_subtitle: 影视 · 游戏 · MOD · 汉化 · 网络编程
  # 首页是否列出资源帖。false 则首页只显示普通文章
  show_resource_entries: true
  # 首页每页显示多少篇（含资源帖）
  post_per_page: 12


# ============================================================================
#  八、三栏布局开关
# ----------------------------------------------------------------------------
#  关掉某一栏后，正文会自动补位到中间，不需要额外调整宽度。
# ============================================================================

rail:
  # 侧栏总开关，false 则左右栏全部隐藏
  enable: true
  left:
    enable: true
    # 左栏宽度；留空则回退到顶层 rail_width
    width: 260px
  right:
    enable: true
    # 右栏宽度；留空则回退到顶层 rail_width
    width: 260px


# ============================================================================
#  九、左栏组件
# ----------------------------------------------------------------------------
#  侧栏组件会按页面类型自动过滤：文章页/资源详情页只保留统计与目录，
#  其余页面显示全部启用的组件。
# ============================================================================

# ---------- 个人名片 ----------
profile:
  enable: true

  # 卡片顶部的小标题；留空则不显示这一行
  title: ''
  # 标题左侧的小图标（内置图标名，如 user / info / layers）
  title_icon: user

  # 头像路径。加载失败会自动回退到主题内置占位头像
  avatar: /images/avatar.jpg
  # 头像直径：纯数字按 px 处理，也可写 '72px' / '5rem'
  avatar_size: 72

  # 头像右下角的角标文字，留空则不显示（如 '博主'、'LV.5'）
  badge: ''
  # 角标的鼠标悬停提示，留空则不显示
  badge_title: ''

  # 主标题（姓名 / 站名）。留空则回退到站点 author
  name: 万物之时
  # 简介文字。设为 false 可整段隐藏；留空则回退到站点 description
  bio: 分享影视、游戏与各类资源，也折腾博客和 Mod 汉化。

  # 社交区上方的小标题，留空则不显示
  social_title: '找到我'
  # 社交按钮里图标的字号（px），按钮尺寸会跟着自适应
  icon_size: 19

  # 社交图标列表。name 用于匹配内置图标，常用：
  #   github / bilibili / telegram / mail / rss / link
  # 还支持：weibo / qq / twitter / x / youtube / user / comment / external
  # title 是鼠标悬停提示和无障碍标签。整段注释掉即可隐藏社交区。
  social:
    - name: github
      url: https://github.com/wanwuzhishi
      title: GitHub
    - name: bilibili
      url: https://space.bilibili.com/441476314
      title: 哔哩哔哩
    - name: telegram
      url: https://t.me/wanwuzhishi
      title: Telegram
    - name: mail
      url: mailto:wanwuzhishi@foxmail.com
      title: 邮箱
    - name: rss
      url: /atom.xml
      title: RSS

# ---------- 音乐播放器 ----------
music:
  enable: true
  # 播放器标题；留空则用 name
  title: 音乐

  # 单曲模式：填音频直链（mp3 / m4a）。留空则播放按钮不可用
  src: ''

  # 歌单模式：填了就优先用 playlist 覆盖单曲
  #playlist:
  #  - name: 曲目一
  #    artist: 歌手
  #    src: https://example.com/a.mp3
  #    cover: /images/covers/hexo-theme.svg

  # 单曲模式下显示的曲目信息
  name: 示例曲目
  artist: 未知艺术家
  cover: /images/covers/hexo-theme.svg

# ---------- 分类（左栏） ----------
category:
  enable: true
  title: 分类
  # 最多显示几个分类，超出折叠为「更多」
  limit: 8

# ---------- 标签（左栏） ----------
tags:
  enable: true
  title: 标签
  # 最多显示几个标签
  limit: 16


# ============================================================================
#  十、右栏组件
# ============================================================================

# ---------- 站点统计 ----------
stats:
  enable: true
  title: 统计
  # 要显示哪些统计项，可自由增删、调整顺序：
  #   posts 文章数 / categories 分类数 / tags 标签数
  #   words 总字数 / runtime 运行时长 / updated 最后活动
  show:
    - posts
    - categories
    - tags
    - words
    - runtime
    - updated
  # 建站日期，用于计算运行时长
  since: 2024-01-01

# ---------- 文章目录 ----------
toc:
  enable: true
  title: 目录
  # 目录收录到第几级标题（1~6）
  depth: 3

# ---------- 日历 ----------
# 注意：文章页与资源详情页会自动隐藏日历，只保留统计和目录
calendar:
  enable: true
  title: 日历

# ---------- 站点信息 ----------
siteinfo:
  enable: true
  title: 站点信息
  # 下面三项按需修改
  build: Hexo
  version: Echo 1.0
  license: CC BY-NC-SA 4.0
  # 站点域名；留空则使用站点 _config.yml 的 url
  domain: ''


# ============================================================================
#  十一、资源板块
# ----------------------------------------------------------------------------
#  资源类型（图标 / 名称）配在站点 _config.yml 的 resources.types，
#  文章 front-matter 里用 resource.type 引用对应的 key。
# ============================================================================

resource:
  # 资源卡片上要展示的字段，顺序即展示顺序。
  # 可用字段：version 版本 / platform 平台 / size 大小 / language 语言
  # 资源详情页还会额外自动追加「更新日期」与提取码。
  show_fields:
    - version
    - platform
    - size
    - language

  # 网盘提取码是否明文显示。false 则显示为「••••」，复制按钮仍可用
  show_password: true

  # 网盘链接区块上方的提示语，留空则不显示
  notice: '资源仅供学习交流，请在下载后 24 小时内删除。'

  # 各网盘的标识色（显示为色块）。键是网盘名称，值是任意 CSS 颜色。
  # 名称不在此表中的网盘会回退到中性灰。
  pan_colors:
    百度网盘: '#2932e1'
    阿里云盘: '#ff6a00'
    夸克网盘: '#2f7dff'
    天翼云盘: '#0090ff'
    123云盘: '#1677ff'
    迅雷云盘: '#2f6bff'
    蓝奏云: '#3ba0ff'
    微云: '#12b7f5'
    奶牛快传: '#ffb02e'
    Google Drive: '#34a853'
    OneDrive: '#0f6cbd'
    Mega: '#d9272e'
    磁力链接: '#7a5cff'
    BT 种子: '#f59e0b'


# ============================================================================
#  十二、文章页
# ----------------------------------------------------------------------------
#  单篇文章的开关都可以在 front-matter 里逐篇覆盖。
# ============================================================================

post:
  # 是否显示「文章目录」折叠块。
  # 想全局关闭写 false；单篇可在 front-matter 写 toc: false
  toc: true
  # 目录收录深度，优先级低于上面的 toc.depth
  toc_depth: 3
  # 是否显示版权声明（原创/转载声明 + 禁止转载提示）
  copyright: true
  # 文章被更新过且更新时间不同于发布时间时，在头部显示「更新于」标记
  updated: true
  # 估算阅读时长用的阅读速度（字/分钟）
  words_per_minute: 300
  # 是否显示上一篇 / 下一篇导航。
  # 文章与资源库分轨导航，两边互不串联
  prev_next: true
  # 正文开头是否显示简介（取 front-matter 的 description）
  # 单篇可在 front-matter 写 intro: false 关闭
  intro: true


# ============================================================================
#  十三、评论系统
# ----------------------------------------------------------------------------
#  主题内置 giscus（数据存于你指定的 GitHub Discussions 仓库）。
#
#  前置条件（缺一不可）：
#    1. 该仓库必须是 public 公开仓库
#    2. 已在仓库 Settings → Applications 安装 giscus app
#    3. 已在仓库 Settings → General 开启 Discussions
#
#  拿到配置的方法：访问 https://giscus.app，按提示填仓库信息即可得到
#  下面这段配置。host 留空时用 https://giscus.app。
# ============================================================================

comments:
  enable: true
  provider: giscus
  giscus:
    # 形如 用户名/仓库名，必须是已装好 giscus app 的公开仓库
    repo: wanwuzhishi/wanwuzhishi.github.io
    repo_id: R_kgDOU7KTsQ
    # 对应仓库里的 Discussions 分类名与分类 ID
    category: Announcements
    category_id: DIC_kwDOU7KTsc4DHQT_
    # discussion 与页面的关联方式：
    #   url      按页面 URL 关联（推荐，换域名不丢评论）
    #   pathname 按页面路径关联
    #   title    按文章标题关联
    mapping: url
    # 1 = 只允许一条 discussion 对应同一页面；0 = 允许多条
    strict: 0
    # 主帖是否显示表情反应（👍 🎉 ❤️）
    reactions_enabled: 1
    # 评论与页面元信息（如标题）的关联方式：
    #   0 仅发送匿名数据；1 同时发送页面 URL 与标题
    emit_metadata: 0
    # 评论输入框位置：top = 在评论上方，bottom = 在评论下方
    input_position: top
    # 配色跟随方案：
    #   preferred_color_scheme 跟随系统（主题切换时会自动同步）
    #   light / dark 固定配色
    theme: preferred_color_scheme
    # 界面语言
    lang: zh-CN


# ============================================================================
#  十四、页脚
# ============================================================================

footer:
  # 起始年份。填了会显示成「2024 - 2026」，留空则只显示当前年
  since: 2024
  # 是否显示「由 Hexo 驱动」之类的 Powered by 信息
  powered: true
  # 备案信息。enable 为 true 且 text 非空时才显示
  beian:
    enable: false
    text:
    link: https://beian.miit.gov.cn/
